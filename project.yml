name: EdgeNotes
options:
  bundleIdPrefix: com.barry
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.barry.EdgeNotes
    PRODUCT_NAME: EdgeNotes
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "5"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 贴边便签
    INFOPLIST_KEY_CFBundleDevelopmentRegion: zh-Hans
    INFOPLIST_KEY_CFBundleAllowMixedLocalizations: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: NO
targets:
  EdgeNotes:
    type: application
    platform: macOS
    sources:
      - path: EdgeNotes
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets: []
