name: EdgeNotes
options:
  bundleIdPrefix: com.barry
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.6.4
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.barry.EdgeNotes
    PRODUCT_NAME: EdgeNotes
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "6"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 贴边便签
    INFOPLIST_KEY_CFBundleDevelopmentRegion: zh-Hans
    INFOPLIST_KEY_CFBundleAllowMixedLocalizations: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: NO
targets:
  EdgeNotes:
    type: application
    platform: macOS
    sources:
      - path: EdgeNotes
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Sparkle
    info:
      path: EdgeNotes/Info.plist
      properties:
        SUFeedURL: https://raw.githubusercontent.com/wuxiao00j/edge-notes/main/appcast.xml
        SUPublicEDKey: HYmfVwaZCuengrYMZTnnu9q1mGBx/ucIo7zNj7+Gp+E=
        SUEnableAutomaticChecks: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets:
        - EdgeNotesTests
  EdgeNotesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EdgeNotesTests
    dependencies:
      - target: EdgeNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.barry.EdgeNotesTests
        PRODUCT_NAME: EdgeNotesTests
